<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Foxtail: Scout's face. One bright eye, one closed over an old scar, a leaf tucked behind the ear. -->
  <rect width="512" height="512" fill="#123a33"/>
  <g id="art">
    <g transform="scale(0.5)">
  
  <circle cx="512" cy="560" r="400" fill="#1c4a41"/>
  <!-- ears -->
  <path d="M232 470 L 214 150 L 452 330 Z" fill="#e2742f"/>
  <path d="M262 430 L 252 228 L 412 344 Z" fill="#7a3a1c"/>
  <path d="M792 470 L 810 150 L 572 330 Z" fill="#e2742f"/>
  <path d="M762 430 L 772 228 L 612 344 Z" fill="#7a3a1c"/>
  <!-- head -->
  <path d="M512 300 C 700 300 830 420 830 560 C 830 640 760 700 680 740 L 512 880 L 344 740 C 264 700 194 640 194 560 C 194 420 324 300 512 300 Z" fill="#f08a3a"/>
  <!-- cheeks -->
  <path d="M194 560 C 260 600 340 640 420 700 L 512 880 L 344 740 C 264 700 194 640 194 560 Z" fill="#fbe7c8"/>
  <path d="M830 560 C 764 600 684 640 604 700 L 512 880 L 680 740 C 760 700 830 640 830 560 Z" fill="#fbe7c8"/>
  <!-- nose -->
  <path d="M468 818 L 556 818 L 512 872 Z" fill="#2b1a12"/>
  <!-- open eye -->
  <ellipse cx="376" cy="560" rx="44" ry="52" fill="#2b1a12"/>
  <circle cx="390" cy="542" r="14" fill="#fbe7c8"/>
  <!-- closed eye with scar -->
  <path d="M600 566 q 48 30 96 0" stroke="#2b1a12" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M636 486 L 676 640" stroke="#7a3a1c" stroke-width="14" stroke-linecap="round"/>
  <!-- leaf tucked behind the ear -->
  <path d="M780 300 C 900 240 960 330 900 420 C 850 400 800 360 780 300 Z" fill="#3f9a6f"/>
  <path d="M790 306 C 840 340 880 380 900 420" stroke="#d9e8c9" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>
  </g>
</svg>
